aid: arka
name: Arka
description: >-
  Arka is a custom packaging company that lets ecommerce brands design, order, and
  ship eco-friendly custom boxes, mailers, and sustainable packaging online. Arka
  offers low minimums, fast turnaround, and plug-in integrations with commerce
  platforms including Shopify, BigCommerce, and Square so merchants can reorder
  packaging alongside their fulfillment workflow. Arka's storefront runs on Shopify
  and exposes a modern agent-commerce surface — a published /llms.txt, an
  agentic-discovery sitemap, OIDC/OAuth 2.0 discovery for the Shopify Customer
  Account API, and a Universal Commerce Protocol (UCP) MCP endpoint that lets AI
  shopping agents search the catalog, build carts, and complete buyer-approved
  checkouts. Surfaced as a 500 Global portfolio company and profiled here as part
  of the API Evangelist network.
